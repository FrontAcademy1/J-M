<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17080c">

<title>Our Love Book</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Caveat:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#12070a;
  --paper:#f4ead7;
  --paper2:#eadbc0;
  --ink:#30171a;
  --red:#8d1725;
  --red2:#b52b3d;
  --gold:#c99a4b;
  --white:#fff9ef;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#3a1019 0,#1d080e 38%,#090306 100%);
  color:white;
  font-family:Cairo,sans-serif;
  touch-action:none;
}

button{
  font:inherit;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

/* ---------------- INTRO ---------------- */

.intro{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#100509;
  transition:opacity .7s ease,visibility .7s ease;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-box{
  width:min(90vw,500px);
  text-align:center;
}

.intro-frame{
  position:relative;
  width:230px;
  height:300px;
  margin:auto;
  border:1px solid rgba(220,175,90,.5);
  border-radius:120px 120px 20px 20px;
  overflow:hidden;
  background:
    linear-gradient(rgba(80,10,20,.2),rgba(0,0,0,.6)),
    url("assets/intro.jpg") center/cover;
  box-shadow:0 20px 70px rgba(0,0,0,.65);
}

.candle{
  position:absolute;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  width:35px;
  height:100px;
  background:linear-gradient(90deg,#d6b36a,#fff2c2,#c99a4b);
  border-radius:5px 5px 3px 3px;
}

.flame{
  position:absolute;
  left:50%;
  top:-42px;
  width:24px;
  height:40px;
  transform:translateX(-50%);
  border-radius:60% 40% 60% 40%;
  background:#ffca58;
  box-shadow:0 0 25px #ff9f22;
  animation:flame 1.2s ease-in-out infinite alternate;
}

@keyframes flame{
  from{transform:translateX(-50%) scale(.9) rotate(-3deg)}
  to{transform:translateX(-50%) scale(1.08) rotate(4deg)}
}

.intro-small{
  margin-top:30px;
  color:#d7b96f;
  letter-spacing:5px;
  font-size:12px;
}

.intro-title{
  font-family:"Playfair Display",serif;
  font-size:clamp(34px,9vw,65px);
  margin:8px 0 20px;
}

.enter{
  border:1px solid rgba(216,166,76,.65);
  background:rgba(255,255,255,.05);
  color:#fff2ce;
  padding:13px 32px;
  border-radius:999px;
  cursor:pointer;
  transition:.2s;
}

.enter:active{
  transform:scale(.95);
}

/* ---------------- TOP ---------------- */

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 22px;
  pointer-events:none;
}

.logo{
  font-family:"Playfair Display",serif;
  letter-spacing:2px;
  color:#f3d798;
  font-size:16px;
}

.page-counter{
  font-family:"Caveat",cursive;
  font-size:23px;
  color:#f8dfaa;
}

/* ---------------- BOOK ---------------- */

.stage{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1800px;
}

.book{
  position:relative;
  width:min(92vw,1000px);
  height:min(76vh,650px);
  min-height:420px;
  transform-style:preserve-3d;
}

.book-shadow{
  position:absolute;
  left:4%;
  right:4%;
  bottom:-25px;
  height:35px;
  background:rgba(0,0,0,.45);
  border-radius:50%;
}

.spread{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  border-radius:12px;
  overflow:hidden;
  box-shadow:
    0 20px 55px rgba(0,0,0,.55),
    0 2px 0 rgba(255,255,255,.15) inset;
  background:#211;
  opacity:0;
  pointer-events:none;
}

.spread.active{
  opacity:1;
  pointer-events:auto;
}

.page{
  position:relative;
  overflow:hidden;
  background-color:var(--paper);
  color:var(--ink);
  background-size:cover;
  background-position:center;
  isolation:isolate;
}

.page.left{
  border-right:1px solid rgba(50,20,15,.25);
}

.page.right{
  border-left:1px solid rgba(50,20,15,.15);
}

.page::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(90deg,rgba(255,255,255,.18),transparent 15%,transparent 85%,rgba(0,0,0,.08));
  pointer-events:none;
}

.page-content{
  position:absolute;
  inset:0;
  padding:clamp(22px,4vw,45px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.page-number{
  position:absolute;
  bottom:16px;
  color:#876e4d;
  font-family:"Caveat",cursive;
  font-size:19px;
}

.page h2{
  font-family:"Playfair Display",serif;
  color:#641521;
  font-size:clamp(25px,4vw,42px);
  margin:0 0 8px;
}

.page p{
  max-width:430px;
  line-height:1.9;
  font-size:clamp(13px,1.8vw,17px);
  margin:7px 0;
}

.script{
  font-family:"Caveat",cursive;
  color:#8d1725;
  font-size:clamp(24px,4vw,38px);
}

.photo{
  width:min(70%,270px);
  aspect-ratio:4/5;
  object-fit:cover;
  padding:8px;
  background:#fffaf0;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  transform:rotate(-2deg);
  margin:15px 0;
}

.right .photo{
  transform:rotate(2deg);
}

/* ---------------- PAGE VIDEO ---------------- */

.page-video{
  width:min(85%,360px);
  max-height:230px;
  object-fit:cover;
  border-radius:8px;
  margin-top:15px;
  box-shadow:0 8px 22px rgba(0,0,0,.25);
  background:#000;
}

/* ---------------- FLOWERS ---------------- */

.flowers{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:4;
}

.flower{
  position:absolute;
  font-size:27px;
  opacity:0;
  transform:translateY(40px) scale(.3) rotate(0);
}

.spread.active .flower{
  animation:flowerAppear .9s ease forwards;
}

.flower:nth-child(1){left:8%;top:8%;animation-delay:.05s}
.flower:nth-child(2){right:9%;top:13%;animation-delay:.15s}
.flower:nth-child(3){left:13%;bottom:10%;animation-delay:.25s}
.flower:nth-child(4){right:12%;bottom:8%;animation-delay:.35s}
.flower:nth-child(5){left:48%;top:5%;animation-delay:.45s}

@keyframes flowerAppear{
  0%{
    opacity:0;
    transform:translateY(35px) scale(.2) rotate(-30deg);
  }
  70%{
    opacity:1;
    transform:translateY(-4px) scale(1.15) rotate(10deg);
  }
  100%{
    opacity:.9;
    transform:translateY(0) scale(1) rotate(0);
  }
}

/* ---------------- TURN ANIMATION ---------------- */

.turn-layer{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:30;
  pointer-events:none;
  transform-style:preserve-3d;
  display:none;
}

.turn-layer.right{
  right:0;
  transform-origin:left center;
}

.turn-layer.left{
  left:0;
  transform-origin:right center;
}

.turn-layer.go-next{
  display:block;
  animation:turnNext .62s cubic-bezier(.22,.72,.2,1) forwards;
}

.turn-layer.go-prev{
  display:block;
  animation:turnPrev .62s cubic-bezier(.22,.72,.2,1) forwards;
}

@keyframes turnNext{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(-180deg)}
}

@keyframes turnPrev{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(180deg)}
}

.turn-paper{
  position:absolute;
  inset:0;
  background:var(--paper);
  box-shadow:0 0 25px rgba(0,0,0,.3);
  overflow:hidden;
  background-size:cover;
  background-position:center;
}

.turn-paper::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(0,0,0,.02),
    transparent 45%,
    rgba(0,0,0,.28)
  );
}

/* ---------------- CONTROLS ---------------- */

.controls{
  position:absolute;
  z-index:50;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
}

.ctrl{
  width:47px;
  height:47px;
  border:1px solid rgba(220,180,100,.55);
  background:rgba(20,5,9,.8);
  color:#f5d99b;
  border-radius:50%;
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:19px;
}

.ctrl.big{
  width:57px;
  height:57px;
  background:#801525;
}

.ctrl:active{
  transform:scale(.9);
}

.ctrl:disabled{
  opacity:.3;
}

/* ---------------- HEART ---------------- */

.heart-button{
  position:absolute;
  z-index:60;
  right:24px;
  bottom:25px;
  width:55px;
  height:55px;
  border:0;
  border-radius:50%;
  background:#8d1725;
  color:white;
  font-size:23px;
  box-shadow:0 8px 25px rgba(100,0,20,.4);
  cursor:pointer;
}

/* ---------------- MODAL ---------------- */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.75);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(92vw,600px);
  max-height:88vh;
  overflow:auto;
  background:var(--paper);
  color:var(--ink);
  border-radius:15px;
  padding:25px;
  text-align:center;
  position:relative;
  box-shadow:0 20px 70px #000;
}

.close{
  position:absolute;
  top:10px;
  left:12px;
  border:0;
  background:none;
  font-size:25px;
  color:#641521;
  cursor:pointer;
}

.modal-box h2{
  font-family:"Playfair Display",serif;
  color:#751727;
}

.modal-video{
  width:100%;
  max-height:55vh;
  background:#000;
  border-radius:10px;
}

.modal-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.action{
  border:0;
  border-radius:999px;
  padding:10px 18px;
  background:#7d1625;
  color:#fff;
  cursor:pointer;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:650px){

  .book{
    width:94vw;
    height:68vh;
    min-height:390px;
  }

  .page-content{
    padding:18px 14px;
  }

  .page h2{
    font-size:23px;
  }

  .page p{
    font-size:12px;
    line-height:1.7;
  }

  .photo{
    width:76%;
    max-height:210px;
  }

  .page-video{
    max-height:150px;
  }

  .controls{
    bottom:16px;
  }

  .heart-button{
    right:13px;
    bottom:18px;
  }

  .logo{
    font-size:13px;
  }

  .page-counter{
    font-size:19px;
  }
}

/* Very small phones */

@media(max-height:650px){
  .book{
    height:65vh;
  }

  .controls{
    bottom:8px;
  }

  .heart-button{
    bottom:10px;
  }
}

/* Reduced motion */

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- INTRO -->
  <section class="intro" id="intro">

    <div class="intro-box">

      <div class="intro-frame">
        <div class="candle">
          <div class="flame"></div>
        </div>
      </div>

      <div class="intro-small">A PRIVATE MEMORY BOOK</div>

      <div class="intro-title">
        Our Love Book
      </div>

      <button class="enter" id="enterBtn">
        Open Our Story
      </button>

    </div>

  </section>


  <!-- TOP -->
  <header class="top">
    <div class="logo">♡ OUR STORY</div>
    <div class="page-counter" id="counter">01 / 10</div>
  </header>


  <!-- BOOK -->
  <main class="stage">

    <div class="book" id="book">

      <div class="book-shadow"></div>

      <!--
        الـ 5 spreads يتم إنشاؤهم من JavaScript
        وكل spread يحتوي صفحتين.
      -->

      <div id="spreads"></div>

      <!-- الصفحة التي تتحرك أثناء التقليب -->
      <div class="turn-layer right" id="turnRight">
        <div class="turn-paper" id="turnPaperRight"></div>
      </div>

      <div class="turn-layer left" id="turnLeft">
        <div class="turn-paper" id="turnPaperLeft"></div>
      </div>

    </div>

  </main>


  <!-- CONTROLS -->
  <div class="controls">

    <button class="ctrl" id="prevBtn" aria-label="Previous">
      ‹
    </button>

    <button class="ctrl big" id="nextBtn" aria-label="Next">
      ›
    </button>

  </div>


  <!-- LOVE BUTTON -->
  <button class="heart-button" id="loveBtn">
    ♥
  </button>


  <!-- MEMORY MODAL -->
  <div class="modal" id="memoryModal">

    <div class="modal-box">

      <button class="close" data-close="memoryModal">×</button>

      <h2 id="memoryTitle">Memory</h2>

      <p id="memoryText"></p>

      <div class="modal-actions">

        <button class="action" id="memoryVideoBtn">
          ▶ تشغيل الفيديو
        </button>

        <button class="action" id="memoryMusicBtn">
          ♪ تشغيل الموسيقى
        </button>

      </div>

    </div>

  </div>


  <!-- VIDEO MODAL -->
  <div class="modal" id="videoModal">

    <div class="modal-box">

      <button class="close" data-close="videoModal">×</button>

      <h2>Our Video</h2>

      <video
        id="mainVideo"
        class="modal-video"
        controls
        playsinline
        preload="none">
      </video>

    </div>

  </div>


  <!-- LOVE MODAL -->
  <div class="modal" id="loveModal">

    <div class="modal-box">

      <button class="close" data-close="loveModal">×</button>

      <div style="font-size:55px;color:#9b182a">♥</div>

      <h2>رسالة صغيرة</h2>

      <p id="loveText"></p>

      <div class="modal-actions">

        <button class="action" id="loveMusic">
          ♪ الموسيقى
        </button>

        <button class="action" id="loveVideo">
          ▶ الفيديو
        </button>

      </div>

    </div>

  </div>

</div>


<script>
"use strict";

/* =========================================================
   1 — ملفاتك

   ضع ملفاتك داخل:

   لو مش عايز فيديو في صفحة معينة:

/* =========================================================
   SETTINGS
   ========================================================= */

const SONG_FILE = "assets/song.mp3";

const FLOWER = "🌸";


/* =========================================================
   ELEMENTS
   ========================================================= */

const spreadsContainer = document.getElementById("spreads");

const counter = document.getElementById("counter");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const turnRight = document.getElementById("turnRight");
const turnLeft = document.getElementById("turnLeft");

const turnPaperRight =
  document.getElementById("turnPaperRight");

const turnPaperLeft =

  document.getElementById("loveMusic");

  document.getElementById("loveVideo");

  document.getElementById("loveText");


/* =========================================================
   STATE
   ========================================================= */

let currentPage = 0;

let isTurning = false;

let currentVideo = "";

let audio = null;


/* =========================================================
   CREATE SPREADS
   ========================================================= */

function createPage(page, index){

  const side = index % 2 === 0 ? "left" : "right";

  const article = document.createElement("article");

  article.className = `page ${side}`;

  article.dataset.index = index;

  article.style.backgroundImage =
    `linear-gradient(rgba(255,248,232,.35),rgba(255,248,232,.35)),url("${page.background}")`;

  const content = document.createElement("div");

  content.className = "page-content";

  content.innerHTML = `

    <div class="script">
      ${escapeHTML(page.script)}
    </div>

    <h2>
      ${escapeHTML(page.title)}
    </h2>

    <p>
      ${escapeHTML(page.sub)}
    </p>

    <img
      class="photo"
      src="${page.photo}"
      alt=""
      loading="${index < 2 ? "eager" : "lazy"}"
      decoding="async"
      onerror="this.style.display='none'"
    >

    <p>
      ${escapeHTML(page.text)}
    </p>

    ${
      page.video
      ?
      `
      <button
        class="action page-video-button"
        data-page-video="${index}">
        ▶ شاهد ذكرى الصفحة
      </button>
      `
      :
      ""
    }

    <span class="page-number">
      ${String(index + 1).padStart(2,"0")}
    </span>

  `;

  article.appendChild(content);

  /* flowers */

  const flowers = document.createElement("div");

  flowers.className = "flowers";

  for(let i=0;i<5;i++){

    const f = document.createElement("span");

    f.className = "flower";

    f.textContent = FLOWER;

    flowers.appendChild(f);

  }

  article.appendChild(flowers);

  return article;

}


function buildBook(){

  spreadsContainer.innerHTML = "";

  for(let i=0;i<10;i+=2){

    const spread = document.createElement("section");

    spread.className = "spread";

    spread.dataset.spread = i / 2;

    spread.appendChild(createPage(PAGES[i],i));

    spread.appendChild(createPage(PAGES[i+1],i+1));

    spreadsContainer.appendChild(spread);

  }

  showSpread(0);

}


/* =========================================================
   SHOW SPREAD
   ========================================================= */

function showSpread(spreadIndex){

  const spreads =
    document.querySelectorAll(".spread");

  spreads.forEach((spread,i)=>{

    spread.classList.toggle(
      "active",
      i === spreadIndex
    );

  });

  currentPage = spreadIndex * 2;

  updateUI();

  /*
    تحميل الفيديو فقط للصفحتين الموجودتين
    حتى لا نحمل 10 فيديوهات مرة واحدة.
  */

  prepareCurrentSpread(spreadIndex);

}


/* =========================================================
   VIDEO LAZY SETUP
   ========================================================= */

function prepareCurrentSpread(spreadIndex){

  const start = spreadIndex * 2;

  const end = start + 1;

  for(let i=start;i<=end;i++){

    const videoButton =
      document.querySelector(
        `[data-page-video="${i}"]`
      );

    if(videoButton){

      videoButton.onclick = function(e){

        e.stopPropagation();

        openPageVideo(i);

      };

    }

  }

}


/* =========================================================
   PAGE VIDEO
   ========================================================= */

function openPageVideo(index){

  const page = PAGES[index];

  if(!page || !page.video) return;

  currentVideo = page.video;

  mainVideo.pause();

  mainVideo.removeAttribute("src");

  /*
    src بيتحط وقت الفتح فقط.
    ده يقلل تحميل الفيديوهات أثناء تقليب الكتاب.
  */

  mainVideo.src = currentVideo;

  videoModal.classList.add("open");

  mainVideo.play().catch(()=>{});

}


/* =========================================================
   PAGE TURN
   ========================================================= */

function nextPage(){

  if(isTurning) return;

  if(currentPage >= 8){

    /*
      الصفحة الأخيرة
      لا يوجد انتقال بعد صفحة 10.
    */

    return;

  }

  isTurning = true;

  const oldSpread =
    currentPage / 2;

  const nextSpread =
    oldSpread + 1;

  /*
    الورقة التي ستتحرك تأخذ صورة
    الصفحة اليمنى الحالية.
  */

  const rightPage =
    PAGES[currentPage + 1];

  turnPaperRight.style.backgroundImage =
    `url("${rightPage.background}")`;

  turnRight.classList.remove("go-next");

  /*
    force reflow
  */

  void turnRight.offsetWidth;

  turnRight.classList.add("go-next");

  setTimeout(()=>{

    showSpread(nextSpread);

  },300);

  setTimeout(()=>{

    turnRight.classList.remove("go-next");

    isTurning = false;

  },650);

}


function prevPage(){

  if(isTurning) return;

  if(currentPage <= 0){

    return;

  }

  isTurning = true;

  const oldSpread =
    currentPage / 2;

  const prevSpread =
    oldSpread - 1;

  const leftPage =
    PAGES[currentPage];

  turnPaperLeft.style.backgroundImage =
    `url("${leftPage.background}")`;

  turnLeft.classList.remove("go-prev");

  void turnLeft.offsetWidth;

  turnLeft.classList.add("go-prev");

  setTimeout(()=>{

    showSpread(prevSpread);

  },300);

  setTimeout(()=>{

    turnLeft.classList.remove("go-prev");

    isTurning = false;

  },650);

}


/* =========================================================
   UI
   ========================================================= */

function updateUI(){

  counter.textContent =
    `${String(currentPage+1).padStart(2,"0")} / 10`;

  prevBtn.disabled =
    currentPage === 0;

  nextBtn.disabled =
    currentPage >= 8;

}


/* =========================================================
   BUTTONS
   ========================================================= */

nextBtn.addEventListener(
  "click",
  nextPage
);

prevBtn.addEventListener(
  "click",
  prevPage
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key === "ArrowLeft"){

      nextPage();

    }

    if(e.key === "ArrowRight"){

      prevPage();

    }

    if(e.key === "Escape"){

      closeAllModals();

    }

  }
);


/* =========================================================
   SWIPE
   ========================================================= */

let startX = 0;
let startY = 0;

const book =
  document.getElementById("book");

book.addEventListener(
  "touchstart",
  e=>{

    if(isTurning) return;

    const touch = e.changedTouches[0];

    startX = touch.clientX;
    startY = touch.clientY;

  },
  {passive:true}
);


book.addEventListener(
  "touchend",
  e=>{

    if(isTurning) return;

    const touch = e.changedTouches[0];

    const dx =
      touch.clientX - startX;

    const dy =
      touch.clientY - startY;

    /*
      تجاهل السحب الرأسي.
    */

    if(Math.abs(dx) < 45) return;

    if(Math.abs(dx) < Math.abs(dy)) return;

    /*
      RTL:
      السحب لليسار = الصفحة التالية
      السحب لليمين = السابقة
    */

    if(dx < 0){

      nextPage();

    }else{

      prevPage();

    }

  },
  {passive:true}
);


/* =========================================================
   ENTER
   ========================================================= */

enterBtn.addEventListener(
  "click",
  ()=>{

    intro.classList.add("hide");

    /*
      تشغيل الموسيقى بعد تفاعل المستخدم
      يسمح للمتصفح بتشغيلها بدون مشكلة autoplay.
    */

    startMusic();

  }
);


/* =========================================================
   MUSIC
   ========================================================= */

function startMusic(){

  if(!audio){

    audio = new Audio(SONG_FILE);

    audio.loop = true;

    audio.preload = "none";

  }

  audio.play().catch(()=>{});

}


function toggleMusic(){

  if(!audio){

    startMusic();

    return;

  }

  if(audio.paused){

    audio.play().catch(()=>{});

  }else{

    audio.pause();

  }

}


memoryMusicBtn.addEventListener(
  "click",
  toggleMusic
);

loveMusic.addEventListener(
  "click",
  toggleMusic
);


/* =========================================================
   MEMORY BUTTON
   ========================================================= */

memoryVideoBtn.addEventListener(
  "click",
  ()=>{

    closeModal(memoryModal);

    openPageVideo(currentPage);

  }
);


/* =========================================================
   LOVE MESSAGE
   ========================================================= */

const LOVE_MESSAGE =
`في حاجات كتير ممكن تتقال،
لكن بعض الذكريات أجمل لما تفضل مكتوبة في مكان خاص.

الكتاب ده مجرد صفحات،
لكن كل صفحة فيه شايلة لحظة وذكرى جميلة.

وكل ما نقلب صفحة،
بنفتكر إن الحكايات الحلوة بتتكوّن من تفاصيل صغيرة.`;

let typingTimer = null;

loveBtn.addEventListener(
  "click",
  ()=>{

    loveModal.classList.add("open");

    loveText.textContent = "";

    clearInterval(typingTimer);

    let i = 0;

    typingTimer = setInterval(()=>{

      loveText.textContent =
        LOVE_MESSAGE.slice(0,i++);

      if(i > LOVE_MESSAGE.length){

        clearInterval(typingTimer);

      }

    },18);

  }
);


loveVideo.addEventListener(
  "click",
  ()=>{

    closeModal(loveModal);

    /*
      فيديو عام اختاره المستخدم
    */

    const firstAvailable =
      PAGES.find(p=>p.video);

    if(firstAvailable){

      const index =
        PAGES.indexOf(firstAvailable);

      openPageVideo(index);

    }

  }
);


/* =========================================================
   MODALS
   ========================================================= */

document.querySelectorAll("[data-close]").forEach(btn=>{

  btn.addEventListener(
    "click",
    ()=>{

      const id =
        btn.dataset.close;

      closeModal(
        document.getElementById(id)
      );

    }
  );

});


function closeModal(modal){

  modal.classList.remove("open");

}


function closeAllModals(){

  document
    .querySelectorAll(".modal")
    .forEach(m=>m.classList.remove("open"));

  mainVideo.pause();

}


/*
  الضغط خارج المودال يغلقه.
*/

document.querySelectorAll(".modal").forEach(modal=>{

  modal.addEventListener(
    "click",
    e=>{

      if(e.target === modal){

        closeModal(modal);

      }

    }
  );

});


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   START
   ========================================================= */

buildBook();

</script>
